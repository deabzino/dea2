name: Update changelog

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: changelog-main
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create a user-facing entry for pushed changes
        run: node scripts/update-changelog.mjs "$(git rev-parse HEAD)"

      - name: Commit and push the updated changelog
        run: |
          if git diff --quiet -- artifacts/api-server/web/changelog.json .github/changelog-state.json; then
            echo "No user-facing changes to add to the changelog."
            exit 0
          fi
          git config user.name "deabzino"
          git config user.email "162216131+deabzino@users.noreply.github.com"
          git add -- artifacts/api-server/web/changelog.json .github/changelog-state.json
          git commit -m "docs: update changelog"
          git push origin HEAD:main
