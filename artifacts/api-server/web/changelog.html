    <script id="theme-bootstrap">
      (function () {
        try {
          var t = localStorage.getItem("dea-theme");
          if (t === "light" || t === "dark")
            document.documentElement.dataset.theme = t;
          else
            document.documentElement.dataset.theme = matchMedia(
              "(prefers-color-scheme: light)",
            ).matches
              ? "light"
              : "dark";
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/site.css?v=6" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-shared-nav></div>
    <main id="main" class="shell page-main">
      <header class="page-heading">
        <span class="eyebrow">A LITTLE BETTER EACH ROUND</span>
        <h1>What’s <span>new.</span></h1>
        <p>Small improvements to help your crew get back to the game.</p>
      </header>
      <section class="changelog-tools">
        <div class="tag-filters" role="group" aria-label="Filter updates">
          <button class="active" data-change-filter="all" aria-pressed="true">
            All updates</button
          ><button data-change-filter="Added" aria-pressed="false">Added</button
          ><button data-change-filter="Improved" aria-pressed="false">
            Improved</button
          ><button data-change-filter="Fixed" aria-pressed="false">Fixed</button
          ><button data-change-filter="Removed" aria-pressed="false">
            Removed
          </button>
        </div>
        <label class="sr-only" for="change-search">Search updates</label>
        <div class="search-wrap">
          <span aria-hidden="true">⌕</span
          ><input
            id="change-search"
            type="search"
            placeholder="Search updates…"
            aria-label="Search updates"
          />
        </div>
        <div class="expand-controls">
          <button id="expand-all">Expand all</button
          ><button id="collapse-all">Collapse all</button>
        </div>
      </section>
      <section id="timeline" class="timeline" aria-live="polite" aria-busy="true">
        <div class="timeline-skeleton" aria-hidden="true">
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
          <div class="timeline-skeleton-entry"><span></span><span></span><span></span><span></span></div>
        </div>
      </section>
      <div id="changelog-error" class="notice error" hidden>
        Updates could not load right now. Please refresh in a moment.
      </div>
      <div id="changelog-empty" class="empty-state" hidden>
        <h2>No updates match</h2>
        <p>Try a different search or update type.</p>
      </div>
    </main>
    <div data-shared-footer></div>
    <script src="/shared.js?v=4" defer></script>
    <script src="/changelog.js?v=2" defer></script>
  </body>
</html>
