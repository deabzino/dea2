<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#090d13"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="theme-color"
      content="#f4f5f1"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="description"
      content="Browse dea's Among Us and Discord server commands."
    />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="__SITE_URL__/commands" />
    <meta property="og:title" content="Commands — dea" />
    <meta
      property="og:description"
      content="Browse dea's Among Us and Discord server commands."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/commands" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Commands — dea" />
    <meta
      name="twitter:description"
      content="Browse dea's Among Us and Discord server commands."
    />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <title>Commands — dea</title>
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link
      rel="icon"
      href="/favicon-16x16.png?v=2"
      sizes="16x16"
      type="image/png"
    />
    <link
      rel="icon"
      href="/favicon-32x32.png?v=2"
      sizes="32x32"
      type="image/png"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link
      rel="icon"
      href="/icon-192.png?v=2"
      sizes="192x192"
      type="image/png"
    />
    <link
      rel="icon"
      href="/icon-512.png?v=2"
      sizes="512x512"
      type="image/png"
    />
    <link
      rel="icon"
      href="/icon-512-maskable.png?v=2"
      sizes="512x512"
      type="image/png"
    />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <script id="theme-bootstrap">
      (function () {
        try {
          var t = localStorage.getItem("dea-theme");
          if (t === "light" || t === "dark")
            document.documentElement.dataset.theme = t;
          else
            document.documentElement.dataset.theme = matchMedia(
              "(prefers-color-scheme: light)",
            ).matches
              ? "light"
              : "dark";
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="/site.css?v=5" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div data-shared-nav></div>
    <main id="main" class="shell page-main">
      <header class="page-heading">
        <span class="eyebrow">YOUR ROUND, YOUR WAY</span>
        <h1>Command <span>deck.</span></h1>
        <p>
          Quick tools for smoother Among Us rounds and a more organized server.
        </p>
        <div class="command-count">
          <strong data-total-count>0</strong><span>commands to explore</span>
        </div>
      </header>
      <section class="command-browser">
        <div class="search-wrap">
          <label class="sr-only" for="command-search">Search commands</label
          ><span aria-hidden="true">⌕</span
          ><input
            id="command-search"
            type="search"
            placeholder="Search commands…"
            autocomplete="off"
          /><kbd>/</kbd>
        </div>
        <div class="filter-row">
          <div class="category-scroll-wrap">
            <button
              class="pill-arrow pill-left"
              aria-label="Scroll categories left"
            >
              ‹
            </button>
            <div
              class="category-pills"
              role="group"
              aria-label="Filter by category"
              id="category-pills"
            ></div>
            <button
              class="pill-arrow pill-right"
              aria-label="Scroll categories right"
            >
              ›
            </button>
          </div>
          <div
            class="mode-toggle"
            role="group"
            aria-label="Filter by command type"
          >
            <button class="active" data-mode="all" aria-pressed="true">
              All</button
            ><button data-mode="prefix" aria-pressed="false">Prefix</button
            ><button data-mode="slash" aria-pressed="false">Slash</button>
          </div>
        </div>
        <div id="command-error" class="notice error" hidden>
          Commands could not load right now. Please refresh in a moment.
        </div>
        <div id="command-grid" class="command-grid" aria-live="polite"></div>
        <div id="command-empty" class="empty-state" hidden>
          <span class="empty-orbit">⌕</span>
          <h2>No commands found</h2>
          <p>Try another search or clear a filter.</p>
          <button class="button secondary" id="clear-filters">
            Clear filters
          </button>
        </div>
      </section>
    </main>
    <div data-shared-footer></div>
    <script src="/shared.js?v=4" defer></script>
    <script src="/commands.js?v=1" defer></script>
  </body>
</html>
